# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
#
# Formal proofs of the kit's cores. The package-root roots point here:
#   dfm run fv-quick    per push: the round trip at a shallow depth, and
#                       the tx and rx break harnesses
#   dfm run fv          nightly: the round trip deep enough for divisor 2
#   dfm run fv-cover    reachability of the cover goals (non-vacuity)
# See PROPERTIES.md for the spec -> invariant -> checker map.
#
# yosys's SV frontend rejects the cores' struct casts, so the cores and
# harness go through sv2v first. --exclude=Assert is required: without it
# sv2v drops every immediate assert, assume and cover, and the proof passes
# vacuously.
fragment:
  name: formal

  tasks:
  - name: sv2v
    uptodate: false
    shell: bash
    run: |
      set -e
      OUT="$TASK_RUNDIR/uart_proto_fv.v"
      sv2v --exclude=Assert -DFORMAL -I"${{ rootdir }}/src" \
        "${{ rootdir }}/src/uart_baud_xtor_core.sv" \
        "${{ rootdir }}/src/uart_tx_xtor_core.sv" \
        "${{ rootdir }}/src/uart_rx_xtor_core.sv" \
        "${{ rootdir }}/src/uart_proto_checker.sv" \
        "${{ rootdir }}/tests/formal/uart_proto_fv.sv" > "$OUT"
      dfm-out fileset --filetype verilogSource --basedir "$TASK_RUNDIR" uart_proto_fv.v

  # Deep enough for two characters at divisor 1 and one at divisor 2.
  - name: bmc
    uses: formal.sby.BMC
    needs: [sv2v]
    with:
      top: uart_proto_fv
      depth: 64

  # One character at divisor 1, any framing.
  - name: bmc-quick
    uses: formal.sby.BMC
    needs: [sv2v]
    with:
      top: uart_proto_fv
      depth: 32

  - name: cover
    uses: formal.sby.Cover
    needs: [sv2v]
    with:
      top: uart_proto_fv
      depth: 64

  - name: sv2v-txbrk
    uptodate: false
    shell: bash
    run: |
      set -e
      OUT="$TASK_RUNDIR/uart_txbrk_fv.v"
      sv2v --exclude=Assert -DFORMAL -I"${{ rootdir }}/src" \
        "${{ rootdir }}/src/uart_tx_xtor_core.sv" \
        "${{ rootdir }}/tests/formal/uart_txbrk_fv.sv" > "$OUT"
      dfm-out fileset --filetype verilogSource --basedir "$TASK_RUNDIR" uart_txbrk_fv.v

  - name: bmc-txbrk
    uses: formal.sby.BMC
    needs: [sv2v-txbrk]
    with:
      top: uart_txbrk_fv
      depth: 30

  - name: cover-txbrk
    uses: formal.sby.Cover
    needs: [sv2v-txbrk]
    with:
      top: uart_txbrk_fv
      depth: 30

  - name: sv2v-rxbrk
    uptodate: false
    shell: bash
    run: |
      set -e
      OUT="$TASK_RUNDIR/uart_rxbrk_fv.v"
      sv2v --exclude=Assert -DFORMAL -I"${{ rootdir }}/src" \
        "${{ rootdir }}/src/uart_rx_xtor_core.sv" \
        "${{ rootdir }}/tests/formal/uart_rxbrk_fv.sv" > "$OUT"
      dfm-out fileset --filetype verilogSource --basedir "$TASK_RUNDIR" uart_rxbrk_fv.v

  - name: bmc-rxbrk
    uses: formal.sby.BMC
    needs: [sv2v-rxbrk]
    with:
      top: uart_rxbrk_fv
      depth: 40

  - name: cover-rxbrk
    uses: formal.sby.Cover
    needs: [sv2v-rxbrk]
    with:
      top: uart_rxbrk_fv
      depth: 40
