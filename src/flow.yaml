# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
#
# No fragment name: its tasks live directly under the package
# (fw.proto.uart.<task>), as in fw-proto-i2c's src/flow.yaml.
fragment:
  tasks:
  # The whole kit: class layer, interfaces, wrappers and cores.
  - export: files
    uses: std.FileSet
    with:
      type: systemVerilogSource
      include:
      - fw_proto_uart_pkg.sv
      - uart_baud_xtor_core.sv
      - uart_tx_xtor_if.sv
      - uart_tx_xtor_core.sv
      - uart_tx_xtor.sv
      - uart_rx_xtor_if.sv
      - uart_rx_xtor_core.sv
      - uart_rx_xtor.sv
      - uart_monitor_xtor_if.sv
      - uart_monitor_xtor_core.sv
      - uart_monitor_xtor.sv
      - uart_proto_checker.sv
      incdirs:
      - .

  - export: class
    uses: std.FileSet
    needs: [xtor-sv]
    with:
      type: systemVerilogSource
      include:
      - fw_proto_uart_pkg.sv
      incdirs:
      - .

  # The synthesizable cores. A 16550-style design shares one
  # uart_baud_xtor_core between tx and rx (K2).
  - export: xtor-core
    uses: std.FileSet
    with:
      type: systemVerilogSource
      include:
      - uart_baud_xtor_core.sv
      - uart_tx_xtor_core.sv
      - uart_rx_xtor_core.sv
      - uart_monitor_xtor_core.sv
      incdirs:
      - .

  - export: xtor-sv
    uses: std.FileSet
    needs: [xtor-core]
    with:
      type: systemVerilogSource
      include:
      - uart_tx_xtor_if.sv
      - uart_rx_xtor_if.sv
      - uart_monitor_xtor_if.sv
      - uart_tx_xtor.sv
      - uart_rx_xtor.sv
      - uart_monitor_xtor.sv
      incdirs:
      - .

  # The protocol checker alone: a passive module with bare line and cfg
  # ports, for a sim bind, real RTL, or a formal harness.
  - export: checker
    uses: std.FileSet
    with:
      type: systemVerilogSource
      include:
      - uart_proto_checker.sv
      incdirs:
      - .
